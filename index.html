<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Kalkulator Subnet</title>
  <style>
    :root { --blue:#2563eb; --border:#e5e7eb; --text:#202124; --muted:#6b7280; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--text); font-family:Inter,"Segoe UI",Arial,sans-serif; }
    header { height:64px; display:flex; align-items:center; border-bottom:1px solid var(--border); padding:0 24px; }
    header strong { color:var(--blue); }
    main { max-width:980px; margin:32px auto; padding:0 20px; }
    .tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:24px; }
    .tab { border:0; background:none; padding:12px 20px; color:var(--muted); cursor:pointer; font-weight:600; }
    .tab.active { color:var(--blue); border-bottom:2px solid var(--blue); }
    .panel { display:none; }
    .panel.active { display:block; }
    .card { border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:0 2px 10px rgba(32,33,36,.04); }
    .grid { display:grid; grid-template-columns:2fr 1fr auto; gap:12px; align-items:end; }
    label { display:block; font-size:13px; font-weight:600; margin-bottom:7px; }
    input { width:100%; height:44px; border:1px solid #d1d5db; border-radius:10px; padding:0 12px; font-size:15px; }
    input:focus { outline:2px solid #bfdbfe; border-color:var(--blue); }
    button.primary { height:44px; border:0; border-radius:10px; background:var(--blue); color:white; padding:0 18px; font-weight:700; cursor:pointer; }
    .error { min-height:20px; color:#b91c1c; margin:10px 0 0; }
    .results { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px; }
    .metric { background:#f8fafc; border-radius:12px; padding:14px; }
    .metric span { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
    .metric strong { font-size:16px; }
    .hidden { display:none; }
    .requirement { display:grid; grid-template-columns:1fr auto; gap:8px; margin-bottom:8px; }
    .remove { height:44px; border:1px solid var(--border); background:#fff; border-radius:10px; cursor:pointer; }
    .add { margin:10px 0 16px; height:38px; border:1px solid #93c5fd; color:var(--blue); background:#eff6ff; border-radius:9px; cursor:pointer; }
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    th,td { text-align:left; padding:10px; border-bottom:1px solid var(--border); font-size:14px; }
    th { color:var(--muted); }
    @media (max-width:650px) { .grid { grid-template-columns:1fr; } .results { grid-template-columns:1fr 1fr; } table { display:block; overflow-x:auto; } }
  </style>
</head>
<body>
  <header><strong>IT Kalkulator</strong></header>
  <main>
    <div class="tabs">
      <button class="tab active" data-tab="subnet">Subnet</button>
      <button class="tab" data-tab="vlsm">VLSM</button>
    </div>

    <section id="subnet" class="panel active">
      <div class="card">
        <div class="grid">
          <div><label for="ip">Alamat IP</label><input id="ip" placeholder="Contoh: 172.16.5.130"></div>
          <div><label for="prefix">Prefix</label><input id="prefix" type="number" min="0" max="32" placeholder="25"></div>
          <button class="primary" id="calculateSubnet">Hitung</button>
        </div>
        <p class="error" id="subnetError"></p>
        <div class="results hidden" id="subnetResults"></div>
      </div>
    </section>

    <section id="vlsm" class="panel">
      <div class="card">
        <label for="network">Network CIDR</label>
        <input id="network" placeholder="Contoh: 192.168.1.0/24">
        <label style="margin-top:14px">Kebutuhan Host</label>
        <div id="requirements"></div>
        <button class="add" id="addRequirement">+ Tambah kebutuhan</button>
        <button class="primary" id="calculateVlsm">Hitung VLSM</button>
        <p class="error" id="vlsmError"></p>
        <div id="vlsmResults"></div>
      </div>
    </section>
  </main>
  <script>
    const tabs = document.querySelectorAll(".tab");
    tabs.forEach(tab => tab.addEventListener("click", () => {
      tabs.forEach(item => item.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(item => item.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.dataset.tab).classList.add("active");
    }));

    document.getElementById("calculateSubnet").addEventListener("click", async () => {
      const error = document.getElementById("subnetError");
      const results = document.getElementById("subnetResults");
      error.textContent = ""; results.classList.add("hidden");
      const ip = document.getElementById("ip").value.trim();
      const prefix = document.getElementById("prefix").value;
      try {
        const response = await fetch(`/api/subnet?ip=${encodeURIComponent(ip)}&prefix=${encodeURIComponent(prefix)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Input tidak valid");
        const fields = [["Mask",data.mask],["Network",data.network],["Broadcast",data.broadcast ?? "-"],["First Host",data.first_host],["Last Host",data.last_host],["Usable Hosts",data.usable_hosts]];
        results.innerHTML = fields.map(([label,value]) => `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`).join("");
        results.classList.remove("hidden");
      } catch (err) { error.textContent = err.message; }
    });

    const requirements = document.getElementById("requirements");
    function addRequirement(value = "") {
      const row = document.createElement("div"); row.className = "requirement";
      row.innerHTML = `<input type="number" min="1" placeholder="Jumlah host" value="${value}"><button class="remove" type="button">Hapus</button>`;
      row.querySelector(".remove").addEventListener("click", () => row.remove());
      requirements.appendChild(row);
    }
    addRequirement();
    document.getElementById("addRequirement").addEventListener("click", () => addRequirement());

    document.getElementById("calculateVlsm").addEventListener("click", async () => {
      const error = document.getElementById("vlsmError");
      const container = document.getElementById("vlsmResults");
      error.textContent = ""; container.innerHTML = "";
      const needs = [...requirements.querySelectorAll("input")].map(input => Number(input.value)).filter(Boolean);
      try {
        const response = await fetch("/api/vlsm", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({network:document.getElementById("network").value.trim(), kebutuhan_host:needs})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Input tidak valid");
        container.innerHTML = `<table><thead><tr><th>Urutan</th><th>Kebutuhan</th><th>Network CIDR</th><th>First Host</th><th>Last Host</th><th>Broadcast</th></tr></thead><tbody>${data.map((item,index)=>`<tr><td>${index+1}</td><td>${item.kebutuhan}</td><td>${item.network_cidr}</td><td>${item.first_host}</td><td>${item.last_host}</td><td>${item.broadcast ?? "-"}</td></tr>`).join("")}</tbody></table>`;
      } catch (err) { error.textContent = err.message; }
    });
  </script>
</body>
</html>
